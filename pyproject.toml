[project]
name = "cronbach-lab"
version = "0.1.0"
description = "Stress-test Cronbach's alpha on simulated Likert survey data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib", "openpyxl>=3.1.5"]

[project.scripts]
cronbach-lab = "cronbach_lab.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pandas-stubs>=3.0.5.260914",
  "pytest",
  "ruff>=0.16.10",
  "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
